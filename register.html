<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Form</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- jQuery Library -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

  <style>
    /* General Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      
      background-image: url('image/register/salonbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Glassmorphism Card Container */
    .card-container {
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      border-radius: 16px;
      
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      
      text-align: center;
      color: #ffffff;
    }

    /* Header */
    .title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* Form Layout */
    .register-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Input Fields with Rounded Pill Style */
    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-group input {
      width: 100%;
      padding: 12px 40px 12px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      outline: none;
      color: #ffffff;
      font-size: 0.9rem;
      transition: border-color 0.3s ease;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.88rem;
    }

    .input-group input:focus {
      border-color: #ffffff;
    }

    .input-group.error input {
      border-color: #ff6b6b;
    }

    /* Icon Placement (Right Aligned) */
    .input-group .icon {
      position: absolute;
      right: 15px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      pointer-events: none;
    }

    /* Interactive Password Toggle Icon */
    .input-group .toggle-password {
      pointer-events: auto;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .input-group .toggle-password:hover {
      color: #ffffff;
    }

    /* Error Message Text */
    .error-msg {
      font-size: 0.78rem;
      color: #ff6b6b;
      margin-top: 4px;
      margin-left: 12px;
      display: none;
      text-align: left;
    }

    /* Rounded White Register Button */
    .submit-btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 25px;
      background-color: #ffffff;
      color: #111827;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background-color: #f3f4f6;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Footer Login Link */
    .login-text {
      font-size: 0.8rem;
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.8);
    }

    .login-text a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    /* Mobile Responsive Rule */
    @media (max-width: 480px) {
      .card-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <h2 class="title">Register</h2>
    
    <form class="register-form" id="registrationForm" novalidate>
      <!-- Username / Name -->
      <div class="input-field-wrapper">
        <div class="input-group">
          <input type="text" id="Name" placeholder="Name">
          <i class="fa-regular fa-user icon"></i>
        </div>
        <span class="error-msg" id="usernameError">Please enter your Name</span>
      </div>

      <!-- Email Address -->
      <div class="input-field-wrapper">
        <div class="input-group">
          <input type="email" id="email" placeholder="Email Address">
          <i class="fa-regular fa-envelope icon"></i>
        </div>
        <span class="error-msg" id="emailError">Please enter your email address</span>
      </div>

      <!-- Phone Number -->
      <div class="input-field-wrapper">
        <div class="input-group">
          <input type="tel" id="phone" maxlength="11" placeholder="Phone Number">
          <i class="fa-solid fa-phone icon"></i>
        </div>
        <span class="error-msg" id="phoneError">This field is required.</span>
      </div>

      <!-- Password -->
      <div class="input-field-wrapper">
        <div class="input-group">
          <input type="password" id="password" placeholder="Password">
          <i class="fa-solid fa-eye-slash icon toggle-password" data-target="#password"></i>
        </div>
        <span class="error-msg" id="passwordError">Please provide a password</span>
      </div>

      <!-- Confirm Password -->
      <div class="input-field-wrapper">
        <div class="input-group">
          <input type="password" id="confirmPassword" placeholder="Confirm Password">
          <i class="fa-solid fa-eye-slash icon toggle-password" data-target="#confirmPassword"></i>
        </div>
        <span class="error-msg" id="confirmPasswordError">Please confirm your password</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Register</button>

      <!-- Footer Link -->
      <p class="login-text">
        Already have an account? <a href="#">Login Here</a>
      </p>
    </form>
  </div>

  <!-- jQuery Logic -->
  <script>
    $(document).ready(function () {
      
      // Enforce numeric-only input for the phone field
      $('#phone').on('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '');
      });

      // Toggle password visibility on icon click
      $('.toggle-password').on('click', function () {
        const targetInput = $($(this).data('target'));
        const type = targetInput.attr('type') === 'password' ? 'text' : 'password';
        
        targetInput.attr('type', type);
        
        // Toggle the icon class between eye and eye-slash
        $(this).toggleClass('fa-eye-slash fa-eye');
      });

      // Form validation on submission
      $('#registrationForm').on('submit', function (e) {
        e.preventDefault();
        let isValid = true;

        // Reset previous errors
        $('.error-msg').hide();
        $('.input-group').removeClass('error');

        // Name / Username validation
        const name = $('#Name').val().trim();
        const namePattern = /^[A-Za-z\s]+$/;
        if (name === '') {
          showError('#Name', '#usernameError', 'Please enter your username');
          isValid = false;
        } else if (!namePattern.test(name)) {
          showError('#Name', '#usernameError', 'Name must contain only letters');
          isValid = false;
        }

        // Email validation
        const email = $('#email').val().trim();
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email === '') {
          showError('#email', '#emailError', 'Please enter your email address');
          isValid = false;
        } else if (!emailPattern.test(email)) {
          showError('#email', '#emailError', 'Please enter a valid email address');
          isValid = false;
        }

        // Phone validation (exactly 11 digits)
        const phone = $('#phone').val().trim();
        const phonePattern = /^[0-9]{11}$/;
        if (phone === '') {
          showError('#phone', '#phoneError', 'This field is required.');
          isValid = false;
        } else if (!phonePattern.test(phone)) {
          showError('#phone', '#phoneError', 'Phone number must be exactly 11 digits.');
          isValid = false;
        }

        // Password validation
        const password = $('#password').val();
        if (password === '') {
          showError('#password', '#passwordError', 'Please provide a password');
          isValid = false;
        } else if (password.length < 6) {
          showError('#password', '#passwordError', 'Password must be at least 6 characters');
          isValid = false;
        }

        // Confirm Password validation
        const confirmPassword = $('#confirmPassword').val();
        if (confirmPassword === '') {
          showError('#confirmPassword', '#confirmPasswordError', 'Please confirm your password');
          isValid = false;
        } else if (password !== confirmPassword) {
          showError('#confirmPassword', '#confirmPasswordError', 'Passwords do not match');
          isValid = false;
        }

        if (isValid) {
          alert('Registration successful!');
        }
      });

      // Clear error display on user input
      $('input').on('input', function () {
        $(this).closest('.input-group').removeClass('error');
        $(this).closest('.input-field-wrapper').find('.error-msg').fadeOut(200);
      });

      function showError(inputSelector, errorSelector, message) {
        $(inputSelector).closest('.input-group').addClass('error');
        $(errorSelector).text(message).fadeIn(200);
      }
    });
  </script>

</body>
</html>
